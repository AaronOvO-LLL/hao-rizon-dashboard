<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171615"><meta name="robots" content="noindex">
<title>404 — Hao-rizon</title>
<style>
:root{--bg:#171615;--ink:#e4ddd0;--muted:#969086;--red:#a73531;--line:#3c3732;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft Yahei",sans-serif;display:grid;place-items:center;padding:24px}
.box{width:min(560px,100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:48px 0}
.mono{font:11px var(--mono);letter-spacing:2px;color:var(--muted)}
h1{margin:18px 0 14px;font-size:clamp(56px,14vw,110px);line-height:.9;font-weight:900;letter-spacing:-6px}
h1 em{font-style:normal;color:var(--red)}
p{font-size:13px;line-height:1.9;color:#b2a69b;margin:0 0 26px}
a{color:inherit;font-size:12px;text-decoration:none;border-bottom:1px solid #958474;padding-bottom:8px}
a:hover{color:#ed9d83}
</style></head>
<body><main class="box">
<span class="mono">ERROR / 404</span>
<h1>LOST IN<br>THE <em>GRID.</em></h1>
<p>这个地址没有对应的页面。也许它还在建造中，也许只是链接写错了。</p>
<a href="/">← 回到首页</a>
</main></body></html>
