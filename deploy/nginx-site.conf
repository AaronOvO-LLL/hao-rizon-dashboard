# Hao-rizon 静态站点 —— nginx 站点配置模板
# 不要直接复制到服务器手改：scripts/install-site.sh 会把 __DOMAIN__ / __ROOT__ 替换掉再安装。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    charset utf-8;

    # 静态站没有后端路由：找不到就 404，不要回落首页（否则错链也会返回 200）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 页面本身不缓存：一发布就能看到新版本
    location = /index.html {
        expires -1;
    }

    # 图片 / 字体 / 图标等带指纹的资源长期缓存（以后换文件名来失效）
    location /assets/ {
        expires 7d;
    }

    access_log /var/log/nginx/__NAME__.access.log;
    error_log  /var/log/nginx/__NAME__.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # HTTPS 由 certbot --nginx 自动写入（它会改写本文件，属正常）
}
